<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }

      button,
      input {
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
      }

      button {
        background: #4f46e5;
        color: white;
        cursor: pointer;
        transition: 0.2s ease;
      }

      button:hover {
        background: #4338ca;
      }

      input {
        background: white;
        border: 1px solid #d1d5db;
        width: 180px;
      }

      #section-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      #section-container span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #dbeafe;
        color: #1e3a8a;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 14px;
      }

      .section-delete {
        background: #ef4444;
        color: white;
        border: none;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        padding: 0;
        font-size: 12px;
        font-weight: bold;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .section-delete:hover {
        background: #dc2626;
      }
    </style>
  </head>
  <body>
    <input id="content" type="text" placeholder="nombreP" />
    <button id="bttn"></button>

    <div id="section-container"></div>
    <input id="dltp" type="text" />
    <button id="delete"></button>

    <button id="p"></button>
  </body>

  <script>
    const bttn = document.getElementById("bttn");
    const sectionContainer = document.getElementById("section-container");
    const dlt = document.getElementById("delete");
    const dltp = document.getElementById("dltp");
    let c = 0;
    let seciom = [];
    const p = document.getElementById("p");
    const content = document.getElementById("content");

    function createSection(v) {
      const section = document.createElement("span");
      section.id = `section${c}`;
      section.textContent = `${v} section${c}`;
      sectionContainer.appendChild(section);
      seciom.push(`section${c}`);
      console.log(seciom);
      const delet = document.createElement("button");
      delet.className = "section-delete";
      delet.textContent = "×";
      delet.title = "Eliminar sección";
      section.appendChild(delet);
      delet.addEventListener("click", () => {
        section.remove();

        const index = seciom.indexOf(section.id);

        if (index > -1) {
          seciom.splice(index, 1);
        }
      });
      return section;
    }

    bttn.addEventListener("click", () => {
      let contentv = content.value;
      if (content.value == "") {
        return;
      }
      c += 1;
      createSection(contentv);
    });

    dlt.addEventListener("click", () => {
      let dltp1 = dltp.value;

      if (dltp1 == "") {
        return;
      }

      const section = document.getElementById(dltp1);

      if (section) {
        section.remove();
        const index = seciom.indexOf(dltp1);

        seciom.splice(index, 1);
      }
    });

    p.addEventListener("click", () => {
      console.log(seciom);
    });
  </script>
</html>
