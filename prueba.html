<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="bttn"></button>
    
    <div id="section-container"></div>
    <input id="dltp" type="text">
    <button id="delete" ></button>
    
  </body>

  <script>
    const bttn = document.getElementById("bttn");
    const sectionContainer = document.getElementById("section-container");
    const dlt = document.getElementById("delete");
    const dltp = document.getElementById("dltp")
    let c = 0;
    let seciom = [];

    function createSection() {
      const section = document.createElement("span");
      section.id = `section${c}`;
      section.textContent = `hola section${c}`;
      sectionContainer.appendChild(section);
      seciom.push(`section${c}`);
      console.log(seciom);
    }


    bttn.addEventListener("click", () => {
      c += 1;
      createSection();
      
    });

    dlt.addEventListener("click", () => {
        let dltp1 = dltp.textContent

        if (dltp1 == ""){
            return
        }else {
            createSection()[`${dltp1}`].remove
        }

    })



  </script>
</html>
